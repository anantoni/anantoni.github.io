name: Anastasios Antoniadis
eyebrow: Senior software engineer, PhD researcher, writer
headline: I investigate technology as infrastructure, business, and power.
intro: Reporting, research, and technical writing on AI, software systems, platform power, and digital culture.
meta_description: Anastasios Antoniadis is a senior software engineer, PhD researcher and writer based in Greece, founder of Lore Armory, covering AI, software systems, platform power, and digital culture.
sidebar_bio: Senior software engineer, PhD researcher and writer in Athens, Greece. Founder of Lore Armory.
author_note: Anastasios Antoniadis is an investigative journalist, writer, and PhD researcher whose work connects technical expertise with public understanding.

bio_paragraphs:
  - "I am an investigative journalist and writer working on the political economy of technology: AI as an economic and social force, software as infrastructure, and platforms as institutions that shape labor, markets, and public life. I look past hype and public relations to what is actually happening, and explain complex technical subjects with evidence, without jargon and without dumbing them down."
  - I am also a PhD researcher in the Department of Informatics and Telecommunications at the University of Athens, supervised by Yannis Smaragdakis since October 2016, and a member of the PLaST research group (programming languages and software technologies). My research is on static analysis of Java programs and on making precise program analysis scale to large software systems.

focus:
  - AI economics
  - Platform governance
  - Software infrastructure
  - Static analysis
  - Digital culture
  - Investigative reporting

