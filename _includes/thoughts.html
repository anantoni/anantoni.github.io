{% assign profile = site.data.profile %}

<section id="writing" class="content-section">
  <div class="section-header">
    <h2 class="section-header__title">Writing</h2>
  </div>
  <div class="card-grid">
  {% for outlet in profile.outlets %}
    <div class="card-grid__item">
      <article class="post-card height-full text-left">
        <p class="post-card__type">{{ outlet.role }}</p>
        <h3 class="post-card__title mb-2"><a href="{{ outlet.url }}">{{ outlet.name }}</a></h3>
        <p class="post-card__excerpt">{{ outlet.note }}</p>
        <div class="post-card__footer">
          <a href="{{ outlet.url }}" class="post-card__action">Visit site</a>
        </div>
      </article>
    </div>
  {% endfor %}
  {% for post in site.posts limit: 6 %}
    <div class="card-grid__item">
      {% include post-card.html %}
    </div>
  {% endfor %}
  </div>
</section>
